<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mgbv</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #18181b;
        }

        #bevy {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        #status {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            color: #f4f4f5;
            background: #18181b;
            font: 16px "Segoe UI", sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="bevy" tabindex="0"></canvas>
    <div id="status" role="status">Loading Bevy…</div>
    <script type="module">
        import init from "./pkg/mgbv.js";

        const status = document.getElementById("status");

        try {
            await init();
            status.remove();
        } catch (error) {
            status.textContent = `Failed to start Bevy: ${error}`;
            console.error(error);
        }
    </script>
</body>
</html>
